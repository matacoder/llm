services:
  # Ollama - движок для запуска LLM моделей
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama  # Именованный volume для надежности
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_HOST=0.0.0.0
    networks:
      - llm-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Open WebUI - веб-интерфейс как ChatGPT
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"  # Доступен на http://localhost:3000
    volumes:
      - ./data/open-webui:/app/backend/data
      - ./documents:/app/backend/data/docs  # Папка для документов
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=true  # Включаем аутентификацию
      - ENABLE_RAG_WEB_SEARCH=false  # Отключаем поиск в интернете
      - ENABLE_RAG_LOCAL_WEB_FETCH=false
      - RAG_EMBEDDING_ENGINE=ollama  # Использовать Ollama для эмбеддингов
      - RAG_EMBEDDING_MODEL=mxbai-embed-large  # Лучшая модель для русского языка
      - CHUNK_SIZE=400  # Оптимальный размер для инструкций
      - CHUNK_OVERLAP=100  # Перекрытие для сохранения контекста
      - RAG_TOP_K=10  # Больше кандидатов для лучшего поиска
      - PDF_EXTRACT_IMAGES=false  # Отключаем извлечение изображений для скорости
      - ENABLE_RAG_HYBRID_SEARCH=true  # Комбинация векторного и полнотекстового поиска
    depends_on:
      - ollama
    networks:
      - llm-network

  # RAG Sync - автоматическая синхронизация документов
  rag-sync:
    image: python:3.12-slim
    container_name: rag-sync
    restart: unless-stopped
    volumes:
      - ./sync-app:/app
      - ./documents:/data/docs:ro  # Папка для мониторинга (только чтение)
      - ./data/sync-state:/data/state  # БД для отслеживания состояния
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt && python app.py"
    environment:
      - OWUI_BASE_URL=http://open-webui:8080
      - OWUI_TOKEN=${OWUI_TOKEN}
      - OWUI_KNOWLEDGE_ID=${OWUI_KNOWLEDGE_ID}
      - WATCH_DIR=/data/docs
      - INCLUDE_GLOBS=*.pdf,*.docx,*.md,*.txt,*.doc,*.odt,*.rtf
      - EXCLUDE_GLOBS=*.tmp,~$$*,*.part
      - CONCURRENCY=2
      - RETRY_MAX=5
      - RETRY_BASE_DELAY=1.0
      - CLEANUP_INTERVAL=300  # Интервал очистки удаленных файлов (секунды)
    depends_on:
      - open-webui
    networks:
      - llm-network

networks:
  llm-network:
    driver: bridge

volumes:
  ollama_data:  # Именованный volume для данных Ollama (модели сохраняются автоматически)
    driver: local
